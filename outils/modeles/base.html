<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titre_page }}</title>
<meta name="description" content="{{ description }}">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css?v={{ version }}">
<link rel="canonical" href="{{ site.url }}{{ chemin }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="fr_FR">
<meta property="og:site_name" content="Les sources">
<meta property="og:title" content="{{ titre_page }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ site.url }}{{ chemin }}">
{% if image %}<meta property="og:image" content="{{ site.url }}/assets/img/{{ image }}">
<meta name="twitter:card" content="summary_large_image">
{% endif %}<meta name="theme-color" content="{{ '#111315' if theme == 'neutre' else '#0B1219' }}">
</head>
<body class="t-{{ theme }}">
{% block corps %}{% endblock %}
{% if script %}<script src="/assets/site.js?v={{ version }}" defer></script>
{% endif %}</body>
</html>
